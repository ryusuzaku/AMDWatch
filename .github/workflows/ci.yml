name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  data:
    name: Data and importer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate data/tracker.json
        run: python scripts/validate_tracker.py

      - name: Importer tests
        run: python -m unittest discover -s tests -t . -v

  site:
    name: Site logic and rendered page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Model tests
        run: npm test

      - name: Serve the site
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 --directory . &
          for _ in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8000/ > /dev/null; then exit 0; fi
            sleep 0.5
          done
          echo "server did not come up" >&2
          exit 1

      - name: Rendered page smoke check
        run: npm run test:page -- http://127.0.0.1:8000

      - name: Upload probe screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-screenshots
          path: scripts/.probe/
          if-no-files-found: ignore

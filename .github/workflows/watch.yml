name: Watch for new driver releases

# The tracker only stays current if something checks. This probes a narrow window around
# today. When AMD publishes a release we have not logged it rebuilds the database and
# publishes it straight to main, so the site stays current without anyone merging anything.
#
# Publishing unattended is safe for ordinary churn, and scripts/check_rebuild.py refuses
# anything that is not: a release disappearing, a fix reverting to pending, coverage going
# gappy, or an unexplained shrink in the issue count. When that fires -- or when the push is
# rejected -- the run falls back to a pull request, which is exactly the case that wants eyes.

on:
  schedule:
    # 06:17 UTC daily. Off the hour on purpose: scheduled runs at :00 queue behind
    # everyone else's cron.
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write # to dispatch the Pages deploy after publishing

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Probe for releases we have not logged
        id: watch
        run: |
          set +e
          python scripts/watch_releases.py --out .watch/new.json
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -ne 0 ] && [ "$status" -ne 10 ]; then
            echo "watcher failed with exit $status" >&2
            exit "$status"
          fi

      # The guard compares the rebuild against what is live, so snapshot it before the
      # rebuild overwrites it.
      - name: Remember the live tracker
        if: steps.watch.outputs.status == '10'
        run: cp data/tracker.json .watch/before.json

      - name: Rebuild the tracker
        if: steps.watch.outputs.status == '10'
        run: |
          python scripts/discover_releases.py --from 22.1 --to "$(date -u +%y.%-m)" \
            --patches 5 --out cache/releases.json
          python scripts/backfill.py \
            --manifest cache/releases.json \
            --out data/tracker.json \
            --review-out data/review.json

      - name: Refuse to publish invalid data
        if: steps.watch.outputs.status == '10'
        run: |
          python scripts/validate_tracker.py
          python -m unittest discover -s tests -t .

      - name: Check the rebuild is ordinary churn
        id: guard
        if: steps.watch.outputs.status == '10'
        run: |
          set +e
          python scripts/check_rebuild.py \
            --before .watch/before.json \
            --after data/tracker.json \
            --review data/review.json
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -ne 0 ] && [ "$status" -ne 20 ]; then
            echo "the guard failed with exit $status" >&2
            exit "$status"
          fi

      - name: Publish
        if: steps.watch.outputs.status == '10'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tracker.json data/review.json
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          {
            echo "Log new AMD driver releases"
            echo
            echo "Generated by scripts/watch_releases.py and scripts/backfill.py."
            echo
            echo '```json'
            cat .watch/new.json
            echo '```'
          } > .watch/commit-msg.txt
          git commit -q -F .watch/commit-msg.txt

          # Ordinary churn goes straight to main. A GITHUB_TOKEN push does not trigger other
          # workflows, so the Pages deploy has to be asked for by name -- without this the
          # repository would update and the site would silently not.
          if [ "${{ steps.guard.outputs.status }}" = "0" ] && git push origin HEAD:main; then
            gh workflow run pages.yml --ref main
            echo "published to main; Pages deploy dispatched"
            exit 0
          fi

          # The guard tripped, or someone moved main underneath us. Either way this wants a
          # human, so open a pull request instead.
          branch="watch/$(date -u +%Y-%m-%d)"
          git checkout -b "$branch"
          git push -u origin "$branch"
          {
            echo "New AMD driver releases were found and logged."
            echo
            if [ "${{ steps.guard.outputs.status }}" != "0" ]; then
              echo "**Held back from publishing automatically.** \`scripts/check_rebuild.py\`"
              echo "found something that is not ordinary churn:"
              echo
              echo '```'
              python scripts/check_rebuild.py \
                --before .watch/before.json \
                --after data/tracker.json \
                --review data/review.json || true
              echo '```'
              echo
            fi
            echo '```json'
            cat .watch/new.json
            echo '```'
            echo
            echo "Review \`data/review.json\` before merging: it lists every automatic issue"
            echo "merge, every reworded variant and every near-miss left as a separate record."
          } > .watch/pr-body.md
          gh pr create \
            --title "Log new AMD driver releases ($(date -u +%Y-%m-%d))" \
            --body-file .watch/pr-body.md \
            --base "${{ github.event.repository.default_branch }}"

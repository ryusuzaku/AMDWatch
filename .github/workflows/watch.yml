name: Watch for new driver releases

# The tracker only stays current if something checks. This probes a narrow window
# around today, and when AMD publishes a release we have not logged, it rebuilds the
# database and opens a pull request rather than pushing to main. New releases change
# issue identity, so a human should see the diff before it lands.

on:
  schedule:
    # 06:17 UTC daily. Off the hour on purpose: scheduled runs at :00 queue behind
    # everyone else's cron.
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Probe for releases we have not logged
        id: watch
        run: |
          set +e
          python scripts/watch_releases.py --out .watch/new.json
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -ne 0 ] && [ "$status" -ne 10 ]; then
            echo "watcher failed with exit $status" >&2
            exit "$status"
          fi

      - name: Rebuild the tracker
        if: steps.watch.outputs.status == '10'
        run: |
          python scripts/discover_releases.py --from 22.1 --to "$(date -u +%y.%-m)" \
            --patches 5 --out cache/releases.json
          python scripts/backfill.py \
            --manifest cache/releases.json \
            --out data/tracker.json \
            --review-out data/review.json

      - name: Refuse to open a pull request with invalid data
        if: steps.watch.outputs.status == '10'
        run: |
          python scripts/validate_tracker.py
          python -m unittest discover -s tests -t .

      - name: Open a pull request
        if: steps.watch.outputs.status == '10'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="watch/$(date -u +%Y-%m-%d)"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "a watch branch for today already exists; leaving it alone"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add data/tracker.json data/review.json
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "Log new AMD driver releases

          Generated by scripts/watch_releases.py and scripts/backfill.py.

          data/review.json records every fuzzy issue merge, every reworded variant
          and every near-miss that was deliberately left as a separate record."
          git push -u origin "$branch"
          {
            echo "New AMD driver releases were found and logged."
            echo
            echo '```json'
            cat .watch/new.json
            echo '```'
            echo
            echo "Review \`data/review.json\` before merging: it lists every automatic"
            echo "issue merge and every near-miss that was left separate."
          } > .watch/pr-body.md
          gh pr create \
            --title "Log new AMD driver releases ($(date -u +%Y-%m-%d))" \
            --body-file .watch/pr-body.md \
            --base "${{ github.event.repository.default_branch }}"

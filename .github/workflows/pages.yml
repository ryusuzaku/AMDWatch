name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refuse to publish invalid data
        run: |
          python scripts/validate_tracker.py
          python -m unittest discover -s tests -t .

      # Publish only what the browser actually fetches. scripts/, schema/, tests/ and
      # the workflow files stay in the repository. data/review.json is a review artifact
      # and stays out too -- it is 130 KB that no page requests.
      - name: Stage the static site
        run: |
          mkdir -p _site/data
          cp index.html app.js style.css _site/
          cp -r lib _site/
          cp data/tracker.json _site/data/
          touch _site/.nojekyll
          echo "published:"
          find _site -type f | sort

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
